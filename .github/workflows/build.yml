name: Build CEF
run-name: CEF ${{ inputs.cef_version }}

# Builds CEF for macOS on Apple silicon from source with the H.264, AAC and
# HEVC decoders the official builds leave out, and publishes the minimal
# distribution as the release <version> (156.0.26) with its SHA-256 and a
# signed provenance attestation. It builds and releases from main only. The
# work is in tools/build-cef.sh.
#
# The build runs on our own Mac (README, "Our Mac runner"), in one job. Its
# tree stays on the Mac's build disk between runs, so a run only checks out
# and builds what changed since the last one, and a job that failed carries
# on where it stopped when it is run again.

on:
  workflow_dispatch:
    inputs:
      cef_version:
        description: Full CEF version, as in cef_binary_<version>
        required: true
        default: 156.0.26+g8ea0c73+chromium-156.0.8078.88
      revision:
        description: Empty for the version's first release; 2, 3 … for another build of it (a release is never replaced)
        default: ""
      fresh:
        description: Delete the tree on the Mac and check out from zero (when an update of it failed)
        type: boolean
        default: false

permissions: {}

# One build at a time: they share the Mac and its tree.
concurrency:
  group: build-cef
  cancel-in-progress: false

env:
  CEF_VERSION: ${{ inputs.cef_version }}
  CEF_REVISION: ${{ inputs.revision }}

jobs:
  build:
    name: Build
    # Releases come from reviewed code only (README, "Checking a release").
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, cef-builder]
    # A build of everything took 87 minutes on a faster Mac; a self-hosted
    # job may run for five days.
    timeout-minutes: 720
    # Read only: the build runs code it downloads (Chromium's hooks and
    # tools), which must find no token worth taking.
    permissions:
      contents: read
    env:
      # On the build disk, outside the runner's own folder, which it cleans.
      CEF_WORK: /Volumes/cef/cef
      CEF_FRESH: ${{ inputs.fresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out or update the tree, build, make the distribution
        run: tools/build-cef.sh local

      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-distrib
          path: ${{ runner.temp }}/cef-distrib/
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
      id-token: write # signing the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cef-distrib
          path: ${{ runner.temp }}/cef-distrib

      # "new", or "published" when a re-run finds this very file released.
      - name: Is it released already?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/build-cef.sh release-state

      # Anyone can check that this workflow built the archive from main
      # (README, "Checking a release").
      - name: Attest the distribution's origin
        if: steps.release.outputs.state == 'new'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/cef-distrib/*.tar.bz2

      - name: Create the release
        if: steps.release.outputs.state == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tools/build-cef.sh publish

